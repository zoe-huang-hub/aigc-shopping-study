<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eceae5"/><stop offset="1" stop-color="#dcd9d2"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9b2a6"/><stop offset="1" stop-color="#a39b8e"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3f5"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
 <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e4e2"/></linearGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="800" height="800" fill="url(#wall)"/>
<rect y="560" width="800" height="240" fill="url(#floor)"/>
<rect y="556" width="800" height="8" fill="#000" opacity=".08"/>
<!-- window -->
<rect x="465.0" y="90" width="190" height="300" rx="4" fill="#f4f4f2"/>
<rect x="475.0" y="100" width="170" height="280" fill="url(#sky)"/>
<path d="M485.0,250 C535.0,200 585.0,215 635.0,190 L635.0,250 Z" fill="#9fbf98"/>
<rect x="475.0" y="250" width="170" height="130" fill="#dfe6ee" opacity=".55"/>
<rect x="557" y="100" width="6" height="280" fill="#f4f4f2"/>
<rect x="435.0" y="80" width="40" height="330" fill="#5f7f99" opacity=".85"/>
<rect x="645.0" y="80" width="40" height="330" fill="#5f7f99" opacity=".85"/>
<!-- art -->
<rect x="90" y="150" width="150" height="110" fill="#fff"/><rect x="100" y="160" width="130" height="90" fill="#a9c1d6"/>
<path d="M100,250 L150,195 L185,230 L205,212 L230,250 Z" fill="#fff" opacity=".35"/>
<!-- bed shadow -->
<ellipse cx="400" cy="640" rx="190.0" ry="26" fill="#000" opacity=".22" filter="url(#soft)"/>
<!-- headboard -->
<rect x="240.0" y="380" width="320" height="150" rx="10" fill="#8d8a86"/>
<rect x="250.0" y="392" width="300" height="10" rx="5" fill="#fff" opacity=".12"/>
<!-- pillows -->
<rect x="270.0" y="458" width="116.0" height="58" rx="22" fill="#f8f8f6"/>
<rect x="414" y="458" width="116.0" height="58" rx="22" fill="#f8f8f6"/>
<rect x="340" y="478" width="120" height="44" rx="16" fill="#5f7f99"/>
<!-- mattress and duvet -->
<path d="M236.0,520 L564.0,520 L584.0,640 L216.0,640 Z" fill="url(#duvet)"/>
<path d="M228.0,565 L572.0,565 L580.0,612 L220.0,612 Z" fill="#5f7f99"/>
<rect x="216.0" y="640" width="368" height="22" fill="#e4e4e2"/>
<rect x="220.0" y="662" width="360" height="16" fill="#000" opacity=".25"/>
<!-- nightstands and lamps -->
<rect x="130.0" y="520" width="80" height="110" rx="4" fill="#8d8a86"/><rect x="130.0" y="560" width="80" height="4" fill="#000" opacity=".15"/>
<rect x="590.0" y="520" width="80" height="110" rx="4" fill="#8d8a86"/><rect x="590.0" y="560" width="80" height="4" fill="#000" opacity=".15"/>
<circle cx="170.0" cy="455" r="70" fill="url(#glow)"/><circle cx="630.0" cy="455" r="70" fill="url(#glow)"/>
<rect x="167.0" y="470" width="6" height="50" fill="#555"/><path d="M142.0,470 L198.0,470 L186.0,430 L154.0,430 Z" fill="#f1efe9"/>
<rect x="627.0" y="470" width="6" height="50" fill="#555"/><path d="M602.0,470 L658.0,470 L646.0,430 L614.0,430 Z" fill="#f1efe9"/>
<!-- rug -->
<ellipse cx="400" cy="735" rx="220.0" ry="40" fill="#5f7f99" opacity=".35"/>
</svg>
