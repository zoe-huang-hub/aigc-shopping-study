<rect x="625.0" y="520" width="80" height="110" rx="4" fill="#c9a96e"/><rect x="625.0" y="560" width="80" height="4" fill="#000" opacity=".15"/>
<circle cx="135.0" cy="455" r="70" fill="url(#glow)"/><circle cx="665.0" cy="455" r="70" fill="url(#glow)"/>
