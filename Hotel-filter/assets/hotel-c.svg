<rect x="435.0" y="250" width="250" height="130" fill="#dfe6ee" opacity=".55"/>
<rect x="557" y="100" width="6" height="280" fill="#f4f4f2"/>
<rect x="395.0" y="80" width="40" height="330" fill="#c9a96e" opacity=".85"/>
<rect x="685.0" y="80" width="40" height="330" fill="#c9a96e" opacity=".85"/>
